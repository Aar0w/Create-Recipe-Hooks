plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'java'
}

version = "${mod_version}+create-fabric-6.0.8.1"
group = "dev.createrecipehooks"
base { archivesName = "create-recipe-hooks-fabric" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    maven {
        // Create Fabric compile stub
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        // Ponder / Catnip / Flywheel (compile classpath for Create Fabric's class hierarchy)
        name = "CreateMod"
        url = "https://maven.createmod.net"
        content {
            includeGroupAndSubgroups "net.createmod"
            includeGroupAndSubgroups "dev.engine-room"
        }
    }
    maven {
        // KubeJS + Rhino (soft dependency for the CRHEvents script integration)
        name = "Latvian"
        url = "https://maven.latvian.dev/releases"
        content { includeGroup "dev.latvian.mods" }
    }
    maven {
        // Architectury API (transitive dependency of KubeJS)
        name = "Architectury"
        url = "https://maven.architectury.dev"
        content { includeGroup "dev.architectury" }
    }
    maven {
        // Porting Lib (fluids module; compile classpath for the porting-lib FluidStack
        // used by Create Fabric's fluid machines)
        name = "devOS"
        url = "https://mvn.devos.one/releases"
        content { includeGroupAndSubgroups "io.github.fabricators_of_create" }
    }
    maven {
        // reach-entity-attributes (transitive dependency of Porting Lib base)
        name = "JamiesWhiteShirt"
        url = "https://maven.jamieswhiteshirt.com/libs-release"
        content { includeGroup "com.jamieswhiteshirt" }
    }
    maven {
        // Forge Config API Port (transitive dependency of Ponder)
        name = "Fuzs"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven"
        content { includeGroup "fuzs.forgeconfigapiport" }
    }
    maven {
        // cardinal-components (potential transitive dependency of Porting Lib)
        name = "Ladysnake"
        url = "https://maven.ladysnake.org/releases"
        content { includeGroupAndSubgroups "dev.onyxstudios" }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojmap: matches the Forge project sources AND Create Fabric (built with Mojmap+Parchment)
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Create Fabric — compile target for the mixins (phase 4). Not needed at dev runtime
    // for the skeleton; real-game testing happens in an actual Fabric instance.
    modCompileOnly "maven.modrinth:create-fabric:${create_fabric_version}"

    // KubeJS — soft dependency for the shared CRHEvents integration (loaded only by KubeJS
    // via kubejs.plugins.txt). Rhino is needed on javac's classpath because EventHandler
    // extends rhino.BaseFunction.
    modCompileOnly "dev.latvian.mods:kubejs-fabric:${kubejs_version}"
    modCompileOnly "dev.latvian.mods:rhino-fabric:${rhino_version}"

    // Porting Lib — Create Fabric's classes reference these (FluidStack in fluids;
    // BlockEntity extension interfaces in base; item handlers in transfer). The modules
    // are nested (jar-in-jar) inside the Create Fabric jar and therefore not visible to
    // javac; pulled explicitly for the compile classpath only.
    ["fluids", "base", "transfer", "extensions", "accessors"].each { module ->
        modCompileOnly "io.github.fabricators_of_create.Porting-Lib:${module}:${porting_lib_version}"
    }

    // Ponder — SmartBlockEntity's hierarchy references net.createmod.ponder.api.VirtualBlockEntity
    modCompileOnly "net.createmod.ponder:Ponder-Fabric-${minecraft_version}:1.0.91"

    // @Nullable / @NotNull used across the shared api/ sources
    compileOnly 'org.jetbrains:annotations:24.1.0'
}

loom {
    mixin {
        // Modern mixin remapping: annotations are remapped by tiny-remapper during
        // remapJar instead of the legacy annotation processor. The legacy AP hard-errors
        // with "Unable to locate obfuscation mapping" on soft targets in Create's own
        // (unmapped) methods; tiny-remapper handles them correctly and needs no refmap.
        useLegacyMixinAp = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
