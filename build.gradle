plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = "${mod_version}+create-${create_version}"
group = "dev.createrecipehooks"
base { archivesName = "create-recipe-hooks-neoforge" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'crh.debug', 'true'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'crh.debug', 'true'
        }
    }

    mods {
        createrecipehooks {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = "Create"
        url = "https://maven.createmod.net"
    }
    maven {
        // KubeJS + Rhino (soft dependency for the CRHEvents script integration)
        name = "Latvian"
        url = "https://maven.latvian.dev/releases"
        content { includeGroup "dev.latvian.mods" }
    }
    maven {
        // Architectury API (transitive dependency of KubeJS)
        name = "Architectury"
        url = "https://maven.architectury.dev"
        content { includeGroup "dev.architectury" }
    }
    mavenCentral()
}

dependencies {
    // Create for NeoForge 1.21.1, compile target for the hooks. Mojmap at runtime,
    // so no deobf step is needed. Not required in dev runs; real-game testing
    // happens in an actual NeoForge instance.
    compileOnly("com.simibubi.create:create-1.21.1:${create_version}") { transitive = false }

    // Create 6.x compile-only dependencies (SmartBlockEntity's hierarchy references
    // Ponder's VirtualBlockEntity; Catnip backs various Create utilities)
    compileOnly("net.createmod.catnip:Catnip-NeoForge-1.21.1:0.8.54") { transitive = false }
    compileOnly("net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.69") { transitive = false }

    // KubeJS, soft dependency for the CRHEvents script integration (loaded only by
    // KubeJS via kubejs.plugins.txt)
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"

    // MixinExtras annotations for @WrapOperation and @Local. NeoForge bundles
    // MixinExtras at runtime, this is compile classpath only.
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'

    // @Nullable / @NotNull used across the api sources
    compileOnly 'org.jetbrains:annotations:24.1.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}
