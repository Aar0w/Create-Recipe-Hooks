modLoader = "javafml"
loaderVersion = "[2,)"
license = "LGPL-3.0-or-later"
issueTrackerURL = "https://github.com/Aar0w/Create-Recipe-Hooks/issues"

[[mods]]
    modId = "createrecipehooks"
    version = "${version}"
    displayName = "Create Recipe Hooks"
    authors = "Aarow"
    logoFile = "crhlogo.png"
    description = '''
        Provides a unified API for listening to Create (and addon) recipe completions.
        Intended for use by FTB Quests, KubeJS, and other integration mods.
    '''

[[dependencies.createrecipehooks]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.createrecipehooks]]
    modId = "create"
    type = "required"
    versionRange = "[6.0.10,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.createrecipehooks]]
    modId = "kubejs"
    type = "optional"
    versionRange = "[2101.7.2,)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
config = "createrecipehooks.mixins.json"
